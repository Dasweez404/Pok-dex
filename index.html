<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<title>Pokédex Caméra</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Pokédex</h1>
  <form id="search" autocomplete="off">
    <input id="q" list="names" placeholder="Nom ou n° (ex. Salamèche, 25)" aria-label="Rechercher un Pokémon">
    <datalist id="names"></datalist>
    <button type="submit">OK</button>
  </form>
</header>

<main>
  <section class="camera">
    <video id="video" playsinline muted autoplay></video>
    <div class="reticle"><i></i><i></i><i></i><i></i></div>
    <div id="status" class="status">Chargement…</div>
    <div class="controls">
      <button id="scan" class="shutter" aria-label="Scanner le Pokémon" disabled><span></span></button>
      <label class="auto"><input type="checkbox" id="auto"> Auto</label>
      <button id="flip" class="ghost" aria-label="Changer de caméra"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
    </div>
    <canvas id="canvas" hidden></canvas>
  </section>

  <section id="result" class="result" hidden>
    <div class="art"><img id="art" alt=""></div>
    <div class="info">
      <p class="num" id="num"></p>
      <h2 id="fr"></h2>
      <p class="en" id="en"></p>
      <p class="types" id="types"></p>
      <h3>Entrées du Pokédex · toutes versions</h3>
      <p id="desc" class="desc"></p>
      <p class="langnote" id="langnote"></p>
      <div id="alts" class="alts"></div>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
